name: Aegis WebSocket Context CI

on:
  push:
    branches:
      - work/aegis-websocket-context-v1-20260829
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Compile changed Aegis boundary
        run: python -m compileall -q src/aegis/market_context.py src/aegis/context_inference.py src/aegis/live_api.py

      - name: Market context contract tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/unit/test_aegis_market_context.py
