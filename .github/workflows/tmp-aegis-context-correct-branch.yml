name: Temporary Aegis Context Migration

on:
  push:
    branches:
      - work/entry-quality-evidence-20260726
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/entry-quality-evidence-20260726

      - name: Apply API migration
        run: python scripts/tmp_patch_aegis_market_context_api.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Compile Aegis boundary
        run: python -m compileall -q src/aegis/market_context.py src/aegis/context_inference.py src/aegis/live_api.py

      - name: Market context contract tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/unit/test_aegis_market_context.py

      - name: Verify REST remains fallback only in API contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/aegis/live_api.py').read_text()
          assert 'market_context: dict[str, Any] | None = None' in text
          assert 'predict_from_snapshot(runtime, snapshot, symbol, request_trace_id)' in text
          assert 'rest_snapshot_provider_used": False' in text
          assert 'runtime.predict(symbol, request_trace_id)' in text
          print('AEGIS_CONTEXT_API_CONTRACT_OK')
          PY

      - name: Commit functional migration
        run: |
          git config user.name "Jasan Hernández"
          git config user.email "31332180+jasanhdz@users.noreply.github.com"
          git add src/aegis/live_api.py
          if git diff --cached --quiet; then
            echo "No API migration changes to commit"
          else
            git commit -m "feat(aegis): consume TypeScript websocket market context"
            git push origin HEAD:work/entry-quality-evidence-20260726
          fi
