enabled: true

# Hot-reloaded on every Turbo evaluation. If this file is missing, disabled,
# incomplete, or invalid, the service falls back to the code defaults.
sizing:
  conservative:
    leverage: 15.0
    position_fraction: 0.08
  normal:
    leverage: 20.0
    position_fraction: 0.12
  premium:
    leverage: 25.0
    position_fraction: 0.18
  max_allowed_leverage: 30.0
  max_allowed_position_fraction: 0.25

thresholds:
  # 0.0 keeps the conservative bucket disabled, matching the previous behavior.
  min_turbo_score_conservative: 0.0
  min_turbo_score_shadow: 0.55
  min_turbo_score_premium: 0.70
  min_agreement_count: 2
  block_if_safe_regime_toxic: true
  experimental_short: true

risk:
  # 0 disables the daily Turbo count limit.
  max_turbo_trades_per_day: 0
  max_consecutive_losses: 2
  daily_loss_stop_pct: 10.0
  daily_profit_lock_pct: 25.0
  cooldown_after_loss_steps: 144
  cooldown_after_two_losses_steps: 288

exits:
  hard_stop_roe: -15.0
  take_profit_roe: 25.0
  trailing_activation_roe: 15.0
  trailing_callback_roe: 8.0
