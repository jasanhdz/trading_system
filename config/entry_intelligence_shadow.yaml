schema_version: aegis-entry-intelligence-shadow-runtime-v1
observer_id: aegis-entry-intelligence-shadow-01
enabled: true
mode: SHADOW
runtime_authority: OBSERVATIONAL_ONLY
feature_schema: aegis-features-v2
feature_count: 83

evidence:
  journal_root: ../data/entry_intelligence_shadow
  signal_journal: signals.jsonl
  outcome_journal: outcomes.jsonl
  acceleration_outcome_journal: directional_acceleration_outcomes.jsonl
  horizon_bars: 12
  round_trip_cost_fraction: 0.001

directional_acceleration:
  minimum_pressure_components: 5
  minimum_acceleration_components: 7
  minimum_persistence: 0.3333333333333333
  minimum_impulse_atr_multiple: 1.5
  minimum_relative_atr_multiple: 0.5
  minimum_volume_zscore: 0.5
  minimum_volume_ratio: 1.1
  minimum_trend_strength: 1.25

timing:
  maximum_wait_bars: 3
  require_global_bearish: true
  require_local_bearish: true
  require_trend_structure: true
  require_short_ema_stack: true
  require_bearish_confirmation_candle: true

ranking:
  maximum_counterfactual_candidates_per_cycle: 1
  preserve_canonical_score: true
  timing_state_precedes_score: true

promotion:
  automatic_training: false
  automatic_promotion: false
  live_authority: false
  owner_authorization_required: true
  minimum_non_overlapping_episodes: 300
  minimum_per_symbol_episodes: 50
  minimum_temporal_blocks: 7
  require_profit_factor_above_one: true
  require_positive_expectancy_95pct_lower_bound: true
  require_both_temporal_halves_positive: true
  require_mae_improvement: true
  require_bounded_symbol_concentration: true
