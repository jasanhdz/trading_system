schema_version: aegis-long-entry-v51-ablation-shadow-preregistration-v1
experiment_id: aegis-long-v51-four-head-ablation-shadow-01
mode: SHADOW
side: LONG
selection_effect: NONE
automatic_live_promotion: false
analysis_class: EXPLORATORY_NOT_PROMOTION_ELIGIBLE

frozen_v5_contract:
  path: config/experiments/aegis_long_entry_v5_shadow.yaml
  sha256: 27c79a8f01d1ae5fcf0e8d75ca44e137d80d2a0ca82dd145a32fe05c20b016ec

frozen_v5_evidence:
