heads:
  SUCCESS:
    output: success_probability
    meaning: TARGET_BEFORE_STOP_PROBABILITY
  NET:
    output: expected_protected_net
    meaning: WORST_PATH_PROTECTED_NET_RETURN
  MAE:
    output: mae_q90
    meaning: NINETIETH_PERCENTILE_ADVERSE_EXCURSION_BOUND
    coverage_is_not_win_probability: true
  SPEED:
    output: time_to_profit_fraction
    meaning: TARGET_TIME_AS_FRACTION_OF_HORIZON

ablation:
  combinations: ALL_NON_EMPTY_SUBSETS
  expected_combination_count: 15
  score_combination: GEOMETRIC_PRODUCT_OF_INCLUDED_CONSERVATIVE_FACTORS
  uncertainty: MAXIMUM_NORMALIZED_UNCERTAINTY_OF_INCLUDED_HEADS
  calibration_only_thresholds: true
  force_minimum_frequency: false
  test_fold_threshold_adjustment: false

post_hoc_sensitivity:
  enabled_after_primary_abstention_result: true
  analysis_class: EXPLORATORY_POINT_ESTIMATE_DIAGNOSTIC_ONLY
  purpose: DISTINGUISH_HEAD_RANKING_INFORMATION_FROM_SAFE_DECISION_READINESS
  score_inputs: POINT_ESTIMATES
  hard_head_constraints: false
  uncertainty_block: false
  promotion_eligibility: false

ranking:
  score_quantiles: [0.50, 0.70, 0.80, 0.90]
  uncertainty_quantiles: [0.50, 0.70, 0.85, 1.00]
  maximum_selected_per_timestamp_grid: [1, 2]

validation:
  method: PURGED_EXPANDING_WALK_FORWARD
  folds: 4
  embargo_minutes: 240
  minimum_calibration_selections: 30
  minimum_test_selections_for_fold_evidence: 15
  minimum_positive_folds: 3
  require_worst_fold_non_negative: true
  report_all_combinations_even_when_invalid: true
  winner_is_hypothesis_for_new_holdout_only: true

deployment:
  current_runtime: RESEARCH_ONLY
  shadow_runtime_enabled: false
  live_runtime: PROHIBITED
  model_export: PROHIBITED
  exchange_authority: false
  exchange_calls: 0
  exchange_mutations: 0
