schema_version: aegis-e4a-mechanical-exit-preregistration-v1
experiment_id: E4A_MECHANICAL_EXIT
classification: PREREGISTERED_DEV_EXPERIMENT
status: PRE_REGISTERED_UNEXECUTED
created_at_utc: "2026-07-19T17:32:00Z"

scientific_identity:
  new_hypothesis: true
  reopens_e3: false
  candidate_eligible: false
  lockbox_validation: false
  operational_policy: false

owner_decision:
  path: reports/experiments/e4a_mechanical_exit/owner_decision.json
  authority: owner_direct_instruction

entry_source:
  path: reports/experiments/e3_validation_official/attempt_1/aegis-short-candidate-e3/runs/d742d9bc0ae867bb/econ_report.json
  physical_sha256: bff472758eacc211dff1b3e2209cbd96e8a845a68f45b9e31526ca2968e6e085
  strategy_id: full_stack
  scenario_id: B_BASE
  side: SHORT
  expected_trade_count: 1292
  expected_trade_set_hash: 7cf1bd1a9a4a78ac8557672acd95e0c2366ed8cfbe9029055edbb5b419c752c7
  identity_fields:
    - symbol
    - fold
    - signal_timestamp
    - entry_timestamp
    - entry_price
    - side

canonical_source:
  path: /home/jasan/Develop/aegis_gen2/d3/canonical_series/v1
  manifest_sha256: 00177a1b8e9e9db9b0cb105b63034bd4b3e5a9c859be3053e59d16be04e52916
  read_only: true
  timeframe_minutes: 5
  timestamp_semantics: CANDLE_OPEN_TIME
  dev_boundary_inclusive: "2026-04-26T23:59:59Z"
  downloads_forbidden: true
  complete_trajectory_minimum_fraction: 0.90

trajectory:
  maximum_horizon_bars: 96
  maximum_horizon_hours: 8
  required_post_entry_bars: 96
  required_pre_entry_bars: 15
  pre_entry_reason: >-
    Fifteen completed bars provide fourteen True Range observations because
    the first observation supplies previous_close for the first included TR.
  incomplete_entry_policy: COUNT_AND_FAIL_COVERAGE_GATE
  interpolation: FORBIDDEN
  exact_symbol_alignment: REQUIRED

fixed_leverage:
  value: 20.0
  sizing_effect: FORBIDDEN
  notional_effect: FORBIDDEN
  equity_effect: FORBIDDEN
  short_price_return_formula: (entry_price - current_price) / entry_price
  short_roe_formula: price_return * 20.0

atr:
  period: 14
  timeframe_minutes: 5
  initialisation: SIMPLE_MEAN_PREVIOUS_14_COMPLETED_TRUE_RANGES
  initial_window: LAST_14_TR_VALUES_ENDING_WITH_SIGNAL_CANDLE
  true_range_formula: max(high-low, abs(high-previous_close), abs(low-previous_close))
  recursive_update_formula: ((previous_atr * 13) + completed_bar_true_range) / 14
  update_timing: AFTER_CURRENT_CANDLE_EVENT_RESOLUTION_AND_COMPLETION
  multiplier: 1.5
  incomplete_candle_use: FORBIDDEN

policy_parameters:
  stop_roe: -0.40
  take_profit_roe: 0.50
  break_even_activation_roe: 0.08
  break_even_price_offset_fraction: 0.003
  trailing_activation_peak_roe: 0.15
  callback_fraction_of_peak_roe: 0.08
  profit_protection_min_peak_roe: 0.08
  profit_protection_giveback_roe: 0.05
  profit_protection_min_protected_roe: 0.01
  profit_protection_immediate_trigger_buffer_fraction: 0.001
  timeout_bars: 96
  partial_exits: FORBIDDEN
  exit_eye: EXCLUDED_MISSING_FROZEN_FUTURE_SIGNALS

resolved_historical_formulas:
  initial_stop_short: entry_price * (1 + abs(stop_roe) / fixed_leverage)
  fixed_take_profit_short: entry_price * (1 - take_profit_roe / fixed_leverage)
  break_even_short: entry_price * (1 - break_even_price_offset_fraction)
  callback_trigger_roe: observed_peak_roe * (1 - callback_fraction_of_peak_roe)
  callback_trigger_price_short: entry_price * (1 - callback_trigger_roe / fixed_leverage)
  atr_trailing_short: lowest_price_observed + current_completed_atr * atr_multiplier
  profit_protection_target_roe: max(min_protected_roe, observed_peak_roe - giveback_roe)
  profit_protection_short: entry_price * (1 - protected_roe / fixed_leverage)
  stop_monotonicity_short: new_stop <= previous_stop

state_machine:
  open_states:
    - OPEN_INITIAL
    - BREAK_EVEN_ARMED
    - TRAILING_ARMED
    - PROFIT_PROTECTION_ARMED
  terminal_states:
    - CLOSED_STOP
    - CLOSED_TAKE_PROFIT
    - CLOSED_BREAK_EVEN
    - CLOSED_TRAILING
    - CLOSED_CALLBACK
    - CLOSED_PROFIT_PROTECTION
    - CLOSED_TIMEOUT
  event_precedence:
    - ACTIVE_STOP
    - FIXED_TAKE_PROFIT
    - CANDLE_COMPLETION
    - PROFIT_PROTECTION_STOP_UPDATE
    - TRAILING_OR_CALLBACK_STOP_UPDATE
    - BREAK_EVEN_STOP_UPDATE
    - TIMEOUT_AT_BAR_96_CLOSE
  candidate_stop_selection: MOST_RISK_REDUCING_SHORT_STOP_THEN_PRECEDENCE_ORDER
  newly_armed_stop_effective: NEXT_CANDLE_IN_CONSERVATIVE_PRIMARY
  timeout_rule: CLOSE_EVERY_REMAINING_POSITION_AT_BAR_96_CLOSE

intrabar:
  primary: CONSERVATIVE
  conservative:
    active_stop_and_take_profit_same_bar: ACTIVE_STOP
    activation_and_exit_same_bar: ACTIVATION_EFFECTIVE_NEXT_CANDLE
    completed_atr_available_for_same_bar_events: false
    low_then_high_path_assumption: FORBIDDEN
    ambiguous_trade_flag: true
  optimistic_sensitivity:
    active_stop_and_take_profit_same_bar: TAKE_PROFIT
    path_for_short: OPEN_LOW_HIGH_CLOSE
    newly_armed_stop_may_execute_same_bar_after_low: true
    promotion_use: FORBIDDEN
  neutral_path: NOT_REGISTERED

policies:
  P0:
    name: E3_H12_CLOSE
    exit: BAR_12_CLOSE
    stop: false
    take_profit: false
  P1:
    name: EIGHT_HOUR_TIME_EXIT
    exit: BAR_96_CLOSE
    stop: false
    take_profit: false
  P2:
    name: HISTORICAL_FIXED_BRACKET
    initial_stop: true
    fixed_take_profit: true
    timeout_bar: 96
  P3:
    name: BRACKET_PLUS_BREAK_EVEN
    inherits: P2
    break_even: true
  P4:
    name: FULL_MECHANICAL_AEGIS_TURBO_CORE
    initial_stop: true
    fixed_take_profit: true
    break_even: true
    atr_trailing: true
    callback_fallback: true
    profit_protection: true
    timeout_bar: 96
    exit_eye: false

cost_scenarios:
  - scenario_id: A_OPTIMISTIC
    fee_bps_per_side: 4.0
    slippage_bps_per_side: 1.0
    funding_bps_per_hour: 0.5
  - scenario_id: B_BASE
    fee_bps_per_side: 5.0
    slippage_bps_per_side: 2.0
    funding_bps_per_hour: 1.0
  - scenario_id: C_PESSIMISTIC
    fee_bps_per_side: 5.0
    slippage_bps_per_side: 5.0
    funding_bps_per_hour: 2.0
cost_application:
  round_trip_fees_and_slippage: 2 * (fee_bps_per_side + slippage_bps_per_side) / 10000
  funding: funding_bps_per_hour / 10000 * actual_holding_bars * 5 / 60
  primary_scenario: B_BASE

folds:
  source: FROZEN_E3_ENTRY_FOLD
  expected_ids: [1, 2, 3, 4]
  no_fold_selection: true

metrics:
  pooled_and_per_fold:
    - trades
    - gross_expectancy
    - net_expectancy
    - profit_factor
    - win_rate
    - average_win
    - average_loss
    - payoff_ratio
    - median_return
    - p01_return
    - p05_return
    - cvar_05
    - maximum_drawdown_non_compounded
    - average_duration_bars
    - median_duration_bars
    - cost_per_trade
    - capture_ratio
    - giveback
    - positive_folds
    - exit_reason_counts
    - intrabar_ambiguity_count
  comparisons_to_p0:
    - delta_gross_expectancy
    - delta_net_expectancy
    - bootstrap_ci90_delta_expectancy
    - delta_profit_factor
    - delta_drawdown
    - delta_capture_ratio
  bootstrap:
    block: ISO_WEEK
    repetitions: 2000
    seed: 20260718
    ci: 0.90
  outlier_and_concentration:
    - EXCLUDE_BEST_1_PERCENT
    - EXCLUDE_WORST_1_PERCENT
    - WINSORIZE_P01_P99
    - BY_SYMBOL
    - BY_FOLD
    - BEST_TRADE_SHARE
    - BEST_1_PERCENT_SHARE
    - BEST_5_PERCENT_SHARE
    - BEST_SYMBOL_SHARE

e4b_justification_criteria:
  policy: P4
  primary_scenario: B_BASE
  all_required: true
  checks:
    - net_expectancy_above_zero
    - profit_factor_at_least_1_05
    - net_expectancy_above_p0
    - ci90_delta_expectancy_excludes_zero_positive
    - at_least_three_positive_folds
    - at_least_three_folds_improve_over_p0
    - superior_to_p1
    - superior_to_p0_without_best_one_percent
    - cvar_and_drawdown_not_materially_worse_than_p0
    - conservative_intrabar_preserves_improvement
    - maximum_positive_pnl_symbol_share_at_most_0_30
    - minimum_100_completed_trades
  tail_risk_material_worsening_definition: >-
    P4 fails if CVaR_05 is lower than P0 or maximum non-compounded drawdown
    is higher than P0 by more than 1e-12.

determinism:
  attempts: 2
  separate_roots: true
  tolerance: 1.0e-12
  byte_identical_scientific_artifacts: true
  operational_timestamps_excluded_from_scientific_hashes: true

failure_states:
  preregistration_order: E4A_BLOCKED_BY_PREREGISTRATION_ORDER_VIOLATION
  entry_drift: E4A_BLOCKED_BY_ENTRY_DRIFT
  data_coverage: E4A_BLOCKED_BY_DATA_COVERAGE
  break_even_semantics: E4A_BLOCKED_BY_BREAK_EVEN_SEMANTICS
  callback_semantics: E4A_BLOCKED_BY_CALLBACK_SEMANTICS
  policy_conflict: E4A_BLOCKED_BY_POLICY_SEMANTICS_CONFLICT
  nondeterminism: E4A_NON_DETERMINISTIC

forbidden:
  - RETRAINING
  - RESCORING
  - RESELECTION
  - THRESHOLD_SEARCH
  - HYPERPARAMETER_SEARCH
  - EXIT_EYE_APPROXIMATION
  - PARTIAL_EXIT
  - LOCKBOX
  - SEMI_BLIND
  - CANDIDATE
  - SELECTION_POLICY
  - SYSTEM_FREEZE
  - SHADOW
  - PAPER
  - LIVE
  - BINANCE
  - PM2
