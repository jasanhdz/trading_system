schema_version: aegis-competing-barrier-v10-preregistration-v1
experiment_id: aegis-competing-barrier-v10-research-01
mode: RESEARCH_ONLY
selection_effect: NONE
automatic_shadow_activation: false
automatic_live_promotion: false

authority:
  source_experiment: aegis-decomposed-entry-v9-research-01
  source_dataset: data/decomposed_entry_v9/canonical_dataset.jsonl.gz
  source_manifest: data/decomposed_entry_v9/dataset_manifest.json
  source_validation: data/decomposed_entry_v9/validation.json
  source_dataset_sha256: 7a8124db3b6c15b9f456ac86a863ae9c15c03b0d2481aee5b5a756fdba2a64e0
  source_manifest_sha256: ba5c5bb856e187dc1317ff957f7b1e8261b75cedea70581e44d853f64c8ee186
  source_validation_sha256: 3310429601e5228a8193491ff1e0c2122dc28aa236b506d7cd0c1377a152d23a
  candle_database: data/binance_candles.db
  public_candle_delta: data/long_entry_v21_shadow/public_candles_delta.jsonl
  candle_database_open_mode: READ_ONLY
  lookback_days: 365
  history_bars: 576
  horizon_bars: 24
  entry_rule: NEXT_BAR_OPEN
  prohibit_future_features: true

episodes:
  spacing_minutes: 120
  identity: SYMBOL_TIMESTAMP_PAIR
  side_neutral: true
  selection_rule: FIRST_ELIGIBLE_THEN_FIXED_SPACING
  outcome_independent: true
  prohibit_overlapping_primary_horizon: true

barriers:
  leverage_for_roe: 15.0
  favorable_roe: [0.05, 0.10, 0.20]
  adverse_roe: [-0.05, -0.10, -0.20]
  horizons_bars: [6, 12, 24]
  bar_minutes: 5
  outcomes: [FAVORABLE_FIRST, ADVERSE_FIRST, SAME_BAR_AMBIGUOUS, NEITHER_REACHED]
  same_bar_policy: AMBIGUOUS_AND_WORST_CASE_FOR_REALIZED_UTILITY
  labels_use_only_future_ohlc: true
  no_causal_condition_in_label: true

costs:
  source_base_round_trip_fraction: 0.0010
  expected_round_trip_fraction: 0.0010
  stress_round_trip_fraction: 0.0015
  severe_round_trip_fraction: 0.0020
  primary_selection_cost: SEVERE

utility:
  predicted_win_value: FAVORABLE_PRICE_FRACTION
  predicted_loss_value: ADVERSE_PRICE_FRACTION
  unknown_penalty_fraction_of_adverse: 0.25
  same_bar_predicted_as_unknown: true
  require_positive_conservative_utility: true
  actual_same_bar_value: WORST_CASE_LOSS
  actual_neither_value: TERMINAL_RETURN_AFTER_SEVERE_COST
  no_continuous_return_regression: true
  no_protection_profile_optimization: true

models:
  direction:
    classes: [LONG, SHORT, ABSTAIN]
    source_contract: ROE_10_H12
    features: V9_DIRECTION_FEATURES
    estimator: HISTOGRAM_GRADIENT_BOOSTING
    calibration: ONE_VS_REST_PLATT_THEN_NORMALIZE
  competing_risk:
    contracts: 9
    classes: [FAVORABLE_FIRST, ADVERSE_FIRST, SAME_BAR_AMBIGUOUS, NEITHER_REACHED]
    features: V9_SIDE_FEATURES
    estimator: HISTOGRAM_GRADIENT_BOOSTING
    calibration: ONE_VS_REST_PLATT_THEN_NORMALIZE
  unknown_state: ABSTAIN
  no_fake_votes: true

validation:
  method: PURGED_EXPANDING_WALK_FORWARD
  folds: 4
  embargo_minutes: 120
  independent_rows_only_for_test: true
  utility_quantiles: [0.50, 0.60, 0.70, 0.80, 0.90]
  direction_probability_quantiles: [0.40, 0.50, 0.60]
  maximum_unknown_probability_quantiles: [0.30, 0.40, 0.50]
  maximum_selected_per_timestamp: 1
  minimum_calibration_selections: 30
  minimum_test_selections_per_fold: 15
  minimum_positive_folds: 3
  require_worst_fold_non_negative: true
  minimum_direction_skilled_folds: 3
  minimum_competing_risk_skilled_contracts_per_fold: 6
  minimum_competing_risk_skilled_folds: 3
  require_realized_utility_above_unfiltered_control: true
  require_cvar_above_control: true
  require_payoff_ratio_at_least: 1.0
  maximum_p95_opportunity_gap_hours: 96
  leave_one_symbol_out_required: true
  minimum_symbols_without_regression: 8
  bootstrap_samples: 500
  prohibit_test_threshold_tuning: true
  prohibit_forced_trade_quota: true

diagnostics:
  current_ts_protected_return: REPORT_ONLY
  mae: REPORT_ONLY
  time_to_positive: REPORT_ONLY
  v9_direction_and_timing: REPORT_ONLY
  alternative_protection_profiles: PROHIBITED

deployment:
  model_export: PROHIBITED_UNTIL_ALL_GATES_PASS
  shadow_runtime: PROHIBITED_UNTIL_SEPARATE_AUTHORIZATION
  live_runtime: PROHIBITED
  exchange_authority: false
  exchange_calls: 0
  exchange_mutations: 0
