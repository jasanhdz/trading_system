schema_version: aegis-long-entry-v3-shadow-preregistration-v1
experiment_id: aegis-long-entry-v3-microstructure-candidates-shadow-01
mode: SHADOW
side: LONG
selection_effect: NONE
automatic_live_promotion: false

source:
  base_database: data/binance_candles.db
  public_candle_delta: data/long_entry_v21_shadow/public_candles_delta.jsonl
  public_microstructure_database: data/long_entry_v3_shadow/public_microstructure.db
  database_open_mode: READ_ONLY
  timeframe: 5m
  lookback_days: 540
  symbols: [ETHUSDT, BTCUSDT, SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT, LINKUSDT, SUIUSDT, LTCUSDT]

public_data_contract:
  host: fapi.binance.com
  method: GET
  authenticated: false
  historical_training_endpoints:
    - /fapi/v1/klines
    - /fapi/v1/fundingRate
  prospective_only_endpoints:
    - /futures/data/openInterestHist
    - /futures/data/takerlongshortRatio
    - /fapi/v1/depth
  minimum_kline_microstructure_coverage: 0.99
  minimum_funding_coverage: 0.90
  maximum_forward_fill_funding_hours: 12
  order_book_historical_backfill: NOT_AVAILABLE
  open_interest_historical_training: PROHIBITED_LATEST_ONE_MONTH_ONLY
  aggregate_trade_historical_training: PROHIBITED_LATEST_24_HOURS_ONLY
  prospective_recent_endpoint_capture: LATEST_500_ROWS_PER_SYMBOL_NO_BACKFILL_CLAIM

sampling:
  history_bars: 576
  horizon_bars: 24
  stride_bars: 6
  independent_test_stride_bars: 12
  entry_rule: NEXT_BAR_OPEN
  source_population: ALL_ALIGNED_SNAPSHOTS

candidate_builder:
  maximum_population_fraction: 0.20
  minimum_population_fraction: 0.005
  families: [BREAKOUT_EXPANSION, TREND_PULLBACK_RECLAIM, CONFIRMED_REVERSAL, BREAKOUT_RETEST]
  breakout_expansion:
    maximum_distance_to_prior_high: 0.0
    minimum_return_3: 0.0
    minimum_close_location: 0.70
    minimum_body_to_range: 0.45
    minimum_volume_ratio: 1.20
    minimum_taker_buy_ratio: 0.53
    minimum_trade_intensity_ratio: 1.00
  trend_pullback_reclaim:
    require_long_trend_stack: true
    require_hourly_long_stack: true
    minimum_return_12: 0.0
    minimum_return_1: 0.0
    minimum_close_vs_ema12_atr: -0.75
    maximum_close_vs_ema12_atr: 0.50
    minimum_taker_buy_ratio: 0.51
  confirmed_reversal:
    maximum_prior_return_12: 0.0
    minimum_return_1: 0.0
    minimum_return_3: 0.0
    require_fast_ema_reclaim: true
    require_lower_wick_dominance: true
    minimum_taker_buy_ratio: 0.55
    minimum_taker_acceleration: 0.0
    minimum_15m_return_3: 0.0
  breakout_retest:
    breakout_lookback_bars: 6
    maximum_retest_distance_atr: 0.50
    minimum_return_1: 0.0
    minimum_taker_buy_ratio: 0.51
    require_long_trend_stack: true

features:
  inherited_v22_count: 156
  microstructure:
    - taker_buy_ratio_1
    - taker_buy_ratio_3
    - taker_buy_ratio_12
    - taker_imbalance_acceleration_3_12
    - trade_intensity_ratio_3_24
    - quote_volume_ratio_3_24
    - average_trade_size_ratio_3_24
    - signed_taker_price_pressure
    - funding_rate_last
    - funding_rate_change
  future_fields_as_features: false
  unavailable_value_policy: FAIL_CLOSED

hard_negatives:
  enabled: true
  types: [WRONG_DIRECTION, LATE_RECOVERY, FALSE_BREAKOUT, FALLING_KNIFE, CHOP_NO_RESOLUTION]
  training_weight: 2.0
  test_weight: 1.0
  outcome_fields_never_features: true

models:
  architecture: THREE_SPECIALISTS_PER_CANDIDATE_FAMILY
  specialists: [DIRECTION, ENTRY_TIMING, PATH_RISK]
  estimator: HISTOGRAM_GRADIENT_BOOSTING
  probability_calibration: PLATT_ON_CALIBRATION_ONLY
  committee_score: DIRECTION_PROBABILITY_TIMES_TIMING_PROBABILITY_TIMES_ONE_MINUS_PATH_RISK
  unavailable_specialist_behavior: FAIL_CLOSED

typescript_protection:
  gate_source: binance-futures-bot-ts/src/domain/services/AegisMicroLiveGate.ts
  gate_source_sha256: 35a30b4e03c048d74fccfe0d255a791b400ea93d17ba1be6b59a065c133efa80
  guardian_source: binance-futures-bot-ts/src/domain/services/ProfitGuardian.ts
  guardian_source_sha256: b362c2939238ead4d5708e3a49ceb12e6b2fa9666e07b1a88eec8dd7faea4932
  runtime_config: binance-futures-bot-ts/regime_config.live.yaml
  runtime_config_sha256: 1306688131baf9f3ed01dcde00dd0ee6d7ef942352764cc7f005b8546964474f
  replay_source: src/aegis/research/hybrid_ts_protection_replay.py
  replay_source_sha256: 433792de841e5accc7d715cf0cce806ffef84dde2c6b8bb49ce675b81517a48a
  leverage: 15.0
  hard_stop_roe: -0.40
  take_profit_roe: 0.50
  break_even_trigger_roe: 0.08
  break_even_offset_fraction: 0.003
  trailing_activation_roe: 0.15
  trailing_callback_roe: 0.08
  atr_period: 14
  atr_multiplier: 1.5
  round_trip_cost_fraction: 0.001
  intrabar_paths: [OPEN_HIGH_LOW_CLOSE, OPEN_LOW_HIGH_CLOSE]
  evaluation_value: WORST_CASE_INTRABAR_PROTECTED_NET_RETURN

ranking:
  method: CROSS_SECTIONAL_PER_TIMESTAMP
  maximum_selected_per_timestamp_grid: [1, 2]
  score_quantiles: [0.70, 0.75, 0.80, 0.85, 0.90, 0.925, 0.95]
  maximum_risk_quantiles: [0.35, 0.45, 0.55, 0.65]
  force_minimum_frequency: false
  maximum_p95_gap_hours: 48

validation:
  method: PURGED_EXPANDING_WALK_FORWARD
  folds: 4
  embargo_minutes: 120
  threshold_source: CALIBRATION_ONLY
  minimum_calibration_selections: 30
  minimum_scoring_selections_per_fold: 15
  minimum_positive_folds: 3
  require_positive_protected_net: true
  require_worst_fold_non_negative: true
  require_selected_mae_below_baseline: true
  require_selected_underwater_below_baseline: true
  leave_one_symbol_out_required: true
  minimum_symbols_without_regression: 8
  prohibit_post_test_threshold_relaxation: true

prospective_shadow:
  minimum_independent_candidates: 300
  minimum_observation_days: 14
  runtime_activation_requires_offline_validation_pass: true

deployment:
  current_runtime: RESEARCH_ONLY
  shadow_runtime_requires_validation_pass: true
  live_runtime: PROHIBITED
  exchange_authority: false
  exchange_mutations: 0
