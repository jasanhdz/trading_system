schema_version: aegis-tail-aware-entry-v8-preregistration-v1
experiment_id: aegis-tail-aware-entry-v8-research-01
mode: RESEARCH_ONLY
selection_effect: NONE
automatic_shadow_activation: false
automatic_live_promotion: false

authority:
  source_experiment: aegis-regime-entry-exit-v7-research-01
  source_dataset: data/regime_entry_exit_v7/canonical_dataset.jsonl.gz
  source_manifest: data/regime_entry_exit_v7/dataset_manifest.json
  source_dataset_sha256: 574d252de00ab428a59c9cc91052e81a72357455c1fcd40f990afa33be588e82
  source_manifest_sha256: 03489014d8c65f080a4ec608fc01b7722f2dcbea69b90240e24e94f97c8d12d3
  candle_database: data/binance_candles.db
  public_candle_delta: data/long_entry_v21_shadow/public_candles_delta.jsonl
  candle_database_open_mode: READ_ONLY
  lookback_days: 365
  history_bars: 576
  horizon_bars: 24
  entry_rule: NEXT_BAR_OPEN
  prohibit_future_features: true

objective:
  primary: POSITIVE_STRESS_COST_NET_EXPECTANCY
  secondary:
    - IMPROVE_LOWER_TAIL_CVAR
    - POSITIVE_PAYOFF_RATIO
    - LOW_MAE
    - FAST_POSITIVE_AFTER_COST
    - CALIBRATED_LATE_ENTRY_RISK
  win_rate_alone_is_not_success: true
  low_mae_alone_is_not_success: true
  protection_cannot_create_directional_edge: true

trajectory:
  leverage: 15.0
  clean_mae_fraction: 0.006
  clean_positive_bar: 6
  late_positive_bar: 12
  catastrophic_net_fraction: -0.010
  tail_quantile: 0.10
  payoff_minimum: 1.0

soft_archetypes:
  identities:
    - TREND_CONTINUATION
    - BREAKOUT
    - REVERSAL
    - RANGE_REVERSION
    - EXHAUSTION_RISK
  normalization: SOFTMAX
  minimum_probability: 0.000001
  hard_transition_bucket: REMOVED
  causal_only: true

forward_regime:
  horizons_bars: [6, 12, 24]
  classes: [BULLISH, BEARISH, RANGE, TRANSITION]
  btc_threshold_at_24_fraction: 0.0025
  breadth_threshold: 0.55
  range_breadth_band: [0.45, 0.55]
  consensus_horizons: 2
  router_calibration: ONE_VS_REST_PLATT_THEN_NORMALIZE
  minimum_skilled_folds: 3
  require_log_loss_below_prior: true
  require_accuracy_not_below_majority: true

late_entry_detector:
  target: EARLY_ADVERSE_OR_SLOW_TO_POSITIVE
  model: HISTOGRAM_GRADIENT_BOOSTING
  calibration: PLATT_ON_CALIBRATION_ONLY
  minimum_skilled_folds: 3
  require_brier_below_prevalence_baseline: true
  require_average_precision_above_prevalence: true
  evaluated_independently_from_entry_selector: true

protection_grid:
  hard_stop_roe: [-0.15, -0.25, -0.40]
  lock_trigger_roe: [0.05, 0.10, 0.20]
  retained_trigger_fraction: 0.50
  trailing_callback_roe: 0.08
  take_profit_roe: 0.50
  leverage: 15.0
  use_atr_trailing: true
  atr_period: 14
  atr_multiplier: 1.5
  replay_intrabar_paths: [OPEN_HIGH_LOW_CLOSE, OPEN_LOW_HIGH_CLOSE]
  aggregate: WORST_INTRABAR_PATH
  current_ts_control:
    hard_stop_roe: -0.40
    break_even_trigger_roe: 0.08
    break_even_offset_fraction: 0.003
    trailing_activation_roe: 0.15
    trailing_callback_roe: 0.08
  production_effect: NONE

cost_sensitivity:
  replay_base_round_trip_fraction: 0.0010
  expected_round_trip_fraction: 0.0010
  stress_round_trip_fraction: 0.0015
  severe_round_trip_fraction: 0.0020
  primary_selection_cost: STRESS
  require_expected_and_stress_positive: true

models:
  architecture: SIDE_SPECIFIC_GLOBAL_WITH_SOFT_ARCHETYPE_INTERACTIONS
  estimator: HISTOGRAM_GRADIENT_BOOSTING
  heads:
    - CLEAN_ENTRY_PROBABILITY
    - LATE_ENTRY_PROBABILITY
    - CATASTROPHIC_LOSS_PROBABILITY
    - POSITIVE_STRESS_NET_PROBABILITY
    - MAE_Q90
    - TIME_TO_POSITIVE
    - PROFILE_STRESS_NET
  probability_calibration: PLATT_ON_CALIBRATION_ONLY
  profile_choice_source: TRAIN_AND_CALIBRATION_ONLY
  no_fake_votes: true
  unknown_state: ABSTAIN

validation:
  method: PURGED_EXPANDING_WALK_FORWARD
  folds: 4
  embargo_minutes: 120
  independent_rows_only_for_test: true
  score_quantiles: [0.70, 0.75, 0.80, 0.85, 0.90]
  maximum_late_probability_quantiles: [0.30, 0.40, 0.50]
  maximum_catastrophic_probability_quantiles: [0.30, 0.40, 0.50]
  maximum_mae_quantiles: [0.40, 0.50, 0.60]
  maximum_selected_per_timestamp: 1
  minimum_calibration_selections: 40
  minimum_test_selections_per_fold: 20
  minimum_positive_folds: 3
  require_worst_fold_non_negative: true
  require_stress_net_above_control: true
  require_cvar_above_control: true
  require_mae_not_worse_than_control: true
  require_payoff_ratio_at_least: 1.0
  maximum_p95_opportunity_gap_hours: 72
  leave_one_symbol_out_required: true
  minimum_symbols_without_regression: 8
  bootstrap_samples: 500
  prohibit_test_threshold_tuning: true
  prohibit_forced_trade_quota: true

deployment:
  model_export: PROHIBITED_UNTIL_ALL_GATES_PASS
  shadow_runtime: PROHIBITED_UNTIL_SEPARATE_AUTHORIZATION
  live_runtime: PROHIBITED
  exchange_authority: false
  exchange_calls: 0
  exchange_mutations: 0
