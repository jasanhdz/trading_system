schema_version: aegis-joint-path-v12-preregistration-v1
experiment_id: aegis-joint-path-v12-research-01
mode: RESEARCH_ONLY
selection_effect: NONE
automatic_shadow_activation: false
automatic_live_promotion: false

authority:
  source_experiment: aegis-calibrated-horizon-v11-research-01
  source_dataset: data/calibrated_horizon_v11/canonical_dataset.jsonl.gz
  source_manifest: data/calibrated_horizon_v11/dataset_manifest.json
  source_validation: data/calibrated_horizon_v11/validation.json
  source_config: config/experiments/aegis_calibrated_horizon_v11_research.yaml
  source_dataset_sha256: 2c270a7b38b2f05c2b4ab78960b788c387e5d98bfae29da16a167f4f54548747
  source_manifest_sha256: 8648567317d7d7690c917afcb36049e1f4af01168c2f9f8b871718cbc41934f4
  source_validation_sha256: c257d4972cabc339243f9d81ba4561d028b703b31f8213fcf61cf30c6f15fe72
  source_config_sha256: 4aa8dbaec916f21506badb58e93f101f4a2655bf02d8c310a33dd91f06eb6eac
  episodes: 48191
  symbols: 11
  entry_rule: NEXT_BAR_OPEN

joint_state:
  classes:
    - COHERENT_CLEAN_FAVORABLE
    - COHERENT_DIRTY_FAVORABLE
    - ADVERSE_FIRST
    - SAME_BAR_AMBIGUOUS
    - UNRESOLVED_OR_DIRECTION_MISMATCH
  direction_source: V10_PRIMARY_DIRECTION_LABEL
  clean_source: V11_PRIMARY_CLEAN_ENTRY_LABEL
  barrier_outcome_source: V10_CONTRACT_OUTCOMES
  no_synthetic_votes: true
  no_continuous_return_regression: true

model:
  estimator: HISTOGRAM_GRADIENT_BOOSTING
  features: V9_SIDE_FEATURES_PLUS_CONTRACT_AND_CAUSAL_REGIME
  one_model_per_side: true
  contracts_stacked_in_training: true
  symbol_specific_estimators: false
  max_iter: 80
  max_leaf_nodes: 15
  min_samples_leaf: 50
  learning_rate: 0.05
  l2_regularization: 4.0

contract_assignment:
  method: POLICY_WINDOW_CAUSAL_REGIME_TABLE
  inputs: [SIDE, CAUSAL_REGIME]
  fallback: SIDE_GLOBAL_POLICY_WINDOW
  minimum_group_rows: 200
  minimum_contract_observations: 30
  prohibit_test_assignment: true
  prohibit_per_candidate_utility_maximization: true

calibration:
  split: NESTED_CHRONOLOGICAL
  method: ONE_VS_REST_PLATT_THEN_NORMALIZE
  expected_calibration_error_bins: 10
  maximum_multiclass_ece: 0.10
  prohibit_test_calibration: true

utility:
  severe_round_trip_fraction: 0.0020
  ambiguous_penalty_fraction_of_adverse: 1.0
  unresolved_penalty_fraction_of_adverse: 0.25
  dirty_favorable_discount: 0.50
  clean_favorable_discount: 1.0
  require_positive_conservative_utility: true
  same_bar_actual_value: WORST_CASE_LOSS
  neither_actual_value: TERMINAL_RETURN_AFTER_SEVERE_COST

selection:
  coherent_probability_quantiles: [0.50, 0.60, 0.70, 0.80, 0.90]
  adverse_probability_quantiles: [0.30, 0.40, 0.50]
  unknown_probability_quantiles: [0.30, 0.40, 0.50]
  utility_quantiles: [0.50, 0.60, 0.70, 0.80, 0.90]
  maximum_selected_per_timestamp: 1
  minimum_policy_selections: 30
  prohibit_forced_trade_quota: true

validation:
  method: PURGED_EXPANDING_WALK_FORWARD_WITH_NESTED_CALIBRATION_AND_POLICY
  folds: 4
  embargo_minutes: 120
  probability_calibration_fraction: 0.50
  contract_assignment_fraction_of_policy: 0.50
  minimum_test_selections_per_fold: 15
  minimum_positive_folds: 3
  require_worst_fold_non_negative: true
  minimum_joint_state_skilled_folds: 3
  require_joint_log_loss_below_training_prior: true
  require_ece_at_most: 0.10
  require_realized_utility_above_unfiltered_control: true
  require_cvar_above_control: true
  require_payoff_ratio_at_least: 1.0
  maximum_p95_opportunity_gap_hours: 96
  minimum_clean_selected_rate: 0.40
  maximum_adverse_first_rate: 0.30
  minimum_mae_improvement_fraction: 0.0
  leave_one_symbol_out_required: true
  minimum_symbols_without_regression: 8
  prohibit_test_threshold_tuning: true

exit_replay:
  profiles:
    - name: FROZEN_CONTRACT
      role: PRIMARY
    - name: CURRENT_TS_STRESS
      role: REPORT_ONLY
  report:
    - mae
    - maximum_favorable_excursion
    - time_to_positive
    - terminal_return
    - favorable_first_rate
    - adverse_first_rate
  stop_40_roi_role: CATASTROPHE_CONTEXT_ONLY
  alternative_exit_optimization: PROHIBITED

deployment:
  model_export: PROHIBITED_UNTIL_ALL_GATES_PASS
  shadow_runtime: PROHIBITED_UNTIL_SEPARATE_AUTHORIZATION
  live_runtime: PROHIBITED
  exchange_authority: false
  exchange_calls: 0
  exchange_mutations: 0
