schema_version: aegis-market-event-economic-path-m1b-preregistration-v1
experiment_id: aegis-market-event-economic-path-m1b-01
registered_at_utc: '2026-08-13T00:00:00Z'
mode: RESEARCH_ONLY
exchange_authority: false
runtime_selection_effect: NONE
automatic_shadow_activation: false
automatic_live_promotion: false

authority:
  m1a_config:
    path: config/experiments/aegis_market_event_fast_track_m1a.yaml
    sha256: d948dffe06bf4af7abc2a99855810b7e21728b2c00814ba38dbaaec00ed211bf
  m1a_result:
    path: reports/governance/aegis_prospective_validation/live/market_event_fast_track_m1a/aegis_market_event_fast_track_m1a_full_result.md
    sha256: 1cabaf783b772d2b787005dbbf0f6decbbee9d936bb2f64f12430e47965b8987
  m1a_private_report_sha256: 374838985a6c0abfd37b8c05bfac763d2735eda31374ce14d7dbae68d251c7a8
  v21_config:
    path: config/experiments/aegis_alpha_laboratory_v21.yaml
