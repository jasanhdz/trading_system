    candle_database_mode: READ_ONLY
  population:
    action_required: SHORT
    row_side_required: SHORT
    independent_required: true
    frozen_direction_source: entry_brain_action
    long_status: NOT_AVAILABLE_CURRENT_BRAIN_SHORT_ONLY
    hold_rows_are_signals: false
    unit: AEGIS_SIGNAL_EPISODE
  entry:
    timestamp: source_timestamp
    price: NEXT_COMPLETE_5M_OPEN_STORED_AS_ENTRY_PRICE
  opportunity_target:
    direction_neutral: true
    definition: MAX_ABSOLUTE_HIGH_LOW_EXCURSION_FROM_ENTRY
    horizons_minutes: [15, 30, 60]
    decisive_thresholds_bps: [30, 50, 75, 100]
    primary_decisive_threshold_bps: 50
    target_must_not_use_aegis_side: true
  economic_outcome:
