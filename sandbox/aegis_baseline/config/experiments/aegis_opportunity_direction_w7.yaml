W7A:
  hypothesis: >-
    A direction-neutral estimate of future movement magnitude can select a
    subset of frozen Aegis directional entries with materially better net
    expectancy, without changing their side.
  source:
    dataset: data/feature_information_v14/canonical_dataset.jsonl.gz
    dataset_sha256: dc5cfef8d13d00e999cfcda86d84e739de078f68c8f5085027fe285d54bbb286
