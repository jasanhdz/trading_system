schema_version: aegis-regime-aware-directional-v6-preregistration-v1
experiment_id: aegis-regime-aware-directional-v6-shadow-01
mode: RESEARCH_SHADOW
selection_effect: NONE
automatic_live_promotion: false

objective:
  primary: POSITIVE_PROTECTED_NET_EXPECTANCY_AFTER_COSTS
  secondary:
    - LOW_MAE
    - SHORT_TIME_TO_PROTECTABLE_ADVANTAGE
    - LOW_UNDERWATER_DURATION
    - LOW_EARLY_REVERSAL_RATE
  full_take_profit_required: false
  train_only_winners: false

source:
  base_database: data/binance_candles.db
  public_delta: data/long_entry_v21_shadow/public_candles_delta.jsonl
  database_open_mode: READ_ONLY
  timeframe: 5m
  lookback_days: 365
  symbols: [ETHUSDT, BTCUSDT, SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT, LINKUSDT, SUIUSDT, LTCUSDT]

sampling:
  history_bars: 576
  horizon_bars: 24
  entry_stride_bars: 12
  independent_test_stride_bars: 24
  entry_rule: NEXT_BAR_OPEN
  population: ALL_CAUSAL_SYMBOL_SIDE_SNAPSHOTS
  overlapping_training_rows_allowed: true
  scoring_rows_must_be_independent: true

regime:
  global_source: BTC_AND_CROSS_SECTIONAL_FEATURES
  local_source: SYMBOL_CAUSAL_MULTITIMEFRAME_FEATURES
  dimensions:
    direction: [BULLISH, NEUTRAL, BEARISH]
    volatility: [LOW, NORMAL, HIGH]
    structure: [TREND, RANGE, TRANSITION]
    phase: [CONTINUATION, PULLBACK, EXHAUSTION, TRANSITION]
  probabilistic_router_required_for_promotion: true
  deterministic_axes_are_research_labels_only: true
  sparse_regime_minimum_rows: 100
  probabilistic_router:
    label_horizon_bars: 24
    btc_direction_threshold_fraction: 0.0025
    cross_section_breadth_threshold: 0.55
    classes: [BULLISH, NEUTRAL, BEARISH]
    calibration: ONE_VS_REST_PLATT_THEN_NORMALIZE
    minimum_skilled_folds: 3
    require_log_loss_below_training_prior: true
    require_accuracy_not_below_majority: true

directional_roles:
  bearish:
    SHORT: PRIMARY_TREND
    LONG: TACTICAL_COUNTERTREND
  bullish:
    LONG: PRIMARY_TREND
    SHORT: TACTICAL_COUNTERTREND
  neutral:
    LONG: SELECTIVE
    SHORT: SELECTIVE

labels:
  leverage_for_roe_translation: 15.0
  protectable_roe_checkpoints: [0.05, 0.10, 0.20, 0.50]
  primary_protectable_roe: 0.05
  favorable_atr_multiple: 1.0
  adverse_atr_multiple: 0.75
  favorable_floor_fraction: 0.0025
  adverse_floor_fraction: 0.0020
  favorable_ceiling_fraction: 0.0150
  adverse_ceiling_fraction: 0.0120
  fast_success_bars: 12
  early_reversal_bars: 3
  round_trip_cost_fraction: 0.0010
  same_bar_barrier_order: FAIL_CLOSED_AMBIGUOUS
  right_censoring: EXPLICIT_HORIZON_CLOSE

typescript_price_protection:
  source: src/aegis/research/hybrid_ts_protection_replay.py
  intrabar_paths: [OPEN_HIGH_LOW_CLOSE, OPEN_LOW_HIGH_CLOSE]
  leverage: 15.0
  hard_stop_roe: -0.40
  take_profit_roe: 0.50
  break_even_trigger_roe: 0.08
  break_even_offset_fraction: 0.003
  trailing_activation_roe: 0.15
  trailing_callback_roe: 0.08
  use_atr_trailing: true
  atr_period: 14
  atr_multiplier: 1.5
  round_trip_cost_fraction: 0.0010

exit_eye_replay:
  source: CURRENT_BRAIN_CANONICAL_REPLAY
  enabled: true
  mode: CLOSE
  min_roe_to_protect: 0.08
  min_peak_roe_to_protect: 0.12
  min_giveback_from_peak_roe: 0.04
  neutral_votes_to_protect: 2
  opposite_votes_to_close: 2
  min_roe_to_close_on_opposite: 0.06
  min_peak_roe_to_close_on_opposite: 0.10
  close_on_neutral_decay: true
  neutral_close_votes: 3
  min_roe_to_close_on_neutral: 0.08
  min_peak_roe_to_close_on_neutral: 0.12
  min_giveback_to_close_on_neutral: 0.04
  require_consecutive_neutral_close: 2
  require_consecutive_neutral: 2
  require_consecutive_opposite: 1
  min_minutes_in_trade: 3
  unavailable_observation_behavior: PRICE_PROTECTION_ONLY_AND_REPORT_INCOMPLETE

models:
  architecture: SEPARATE_LONG_AND_SHORT_SPECIALISTS_WITH_SHARED_CONTRACT
  estimator: HISTOGRAM_GRADIENT_BOOSTING
  heads:
    - PROTECTABLE_ADVANTAGE_PROBABILITY
    - TARGET_BEFORE_STOP_PROBABILITY
    - EARLY_REVERSAL_PROBABILITY
    - EXPECTED_PROTECTED_NET
    - MAE_Q90
    - TIME_TO_PROTECTABLE_ADVANTAGE
  calibration: PLATT_ON_CALIBRATION_ONLY
  probability_calibration_groups: [SIDE, REGIME_DIRECTION, DIRECTIONAL_ROLE]
  uncertainty: BOOTSTRAP_CONFIDENCE_INTERVAL
  unknown_state: ABSTAIN

ablations:
  purpose: DIAGNOSTIC_ONLY_NOT_PROMOTION_ELIGIBLE
  calibration_score_quantile: 0.80
  maximum_selected_per_timestamp: 1
  variants:
    - PROTECTABLE_ONLY
    - TARGET_ONLY
    - REVERSAL_ONLY
    - PROTECTED_NET_ONLY
    - MAE_ONLY
    - SPEED_ONLY
    - PROTECTABLE_AND_NET
    - MAE_AND_SPEED
    - FULL_COMMITTEE

policy_search:
  source: CALIBRATION_ONLY
  score_quantiles: [0.70, 0.75, 0.80, 0.85, 0.90]
  maximum_mae_quantiles: [0.40, 0.50, 0.60]
  maximum_time_quantiles: [0.40, 0.50, 0.60]
  maximum_reversal_quantiles: [0.30, 0.40, 0.50]
  maximum_selected_per_timestamp_grid: [1, 2]
  no_forced_trade_quota: true
  no_test_threshold_tuning: true

validation:
  method: PURGED_EXPANDING_WALK_FORWARD
  folds: 4
  embargo_minutes: 120
  minimum_calibration_selections: 40
  minimum_test_selections_per_fold: 20
  minimum_positive_folds: 3
  require_worst_fold_non_negative: true
  require_net_above_unfiltered_baseline: true
  require_mae_q90_not_worse_than_baseline: true
  require_underwater_not_worse_than_baseline: true
  require_protectable_rate_above_baseline: true
  leave_one_symbol_out_required: true
  minimum_symbols_without_regression: 8
  report_maximum_no_trade_gap_hours: true
  maximum_p95_gap_hours: 72
  probability_metrics: [BRIER, LOG_LOSS, RELIABILITY_TABLE]
  bootstrap_samples: 500
  prohibit_post_test_threshold_relaxation: true

shadow:
  decision_comparison: CURRENT_VS_V6_COUNTERFACTUAL
  append_only_journal_required: true
  outcome_maturation_required: true
  minimum_independent_episodes_before_review: 300
  runtime_enabled_only_after_historical_validation_pass: true
  exchange_authority: false
  exchange_calls: 0
  exchange_mutations: 0

deployment:
  current_runtime: RESEARCH_ONLY
  shadow_runtime: CONDITIONAL_AFTER_VALIDATION
  live_runtime: PROHIBITED
  model_export: PROHIBITED_UNTIL_ALL_GATES_PASS
  automatic_promotion: false
  exchange_authority: false
  exchange_mutations: 0
