schema_version: aegis-regime-entry-exit-v7-preregistration-v1
experiment_id: aegis-regime-entry-exit-v7-research-01
mode: RESEARCH_ONLY
selection_effect: NONE
automatic_shadow_activation: false
automatic_live_promotion: false

authority:
  source_experiment: aegis-regime-aware-directional-v6-shadow-01
  source_dataset: data/regime_aware_directional_v6/canonical_dataset.jsonl.gz
  source_manifest: data/regime_aware_directional_v6/dataset_manifest.json
  source_dataset_sha256: 07d0e6edf8118a783454c1e8dbef4f892fde5b9c3f643d05b0a6b657fa438beb
  source_manifest_sha256: 629eb86a052c83196c44d11c9cea468ec69e5d83ad5e9cbd13e5d6ae2b0d483e
  entry_rule: NEXT_BAR_OPEN
  source_feature_count: 147
  prohibit_future_features: true
  candle_database: data/binance_candles.db
  public_candle_delta: data/long_entry_v21_shadow/public_candles_delta.jsonl
  candle_database_open_mode: READ_ONLY
  lookback_days: 365
  history_bars: 576
  horizon_bars: 24

objective:
  primary: POSITIVE_PROTECTED_NET_EXPECTANCY_AFTER_COSTS
  joint_entry_quality:
    - POSITIVE_PROTECTED_NET
    - LOW_MAE
    - FAST_POSITIVE_AFTER_COST
    - LOW_EARLY_REVERSAL_RISK
    - HIGH_PROFIT_CAPTURE_EFFICIENCY
  roi_is_not_a_probability: true
  low_mae_alone_is_not_success: true
  train_only_winners: false

trajectory_audit:
  leverage_for_roe_reporting: 15.0
  maximum_clean_mae_fraction: 0.006
  maximum_clean_positive_bar: 6
  late_entry_extension_atr: 2.0
  late_entry_positive_bar: 12
  minimum_available_net_fraction: 0.001
  responsibility_classes:
    - CLEAN_REALIZED_WIN
    - GOOD_ENTRY_POOR_CAPTURE
    - LATE_OR_ADVERSE_ENTRY
    - NO_DIRECTIONAL_EDGE
    - AMBIGUOUS_PATH

archetypes:
  identities:
    - TREND_CONTINUATION
    - CONFIRMED_BREAKOUT
    - CONFIRMED_REVERSAL
    - RANGE_REVERSION
    - TRANSITION_SELECTIVE
  minimum_training_rows: 500
  unknown_archetype_behavior: ABSTAIN

context:
  retain_all_v6_features: true
  added_causal_features:
    - SIDE_EXTENSION_ATR
    - SIDE_ACCELERATION
    - VOLUME_DIRECTION_IMPULSE
    - BTC_SIDE_ALIGNMENT
    - RELATIVE_SIDE_STRENGTH
    - M15_SIDE_ALIGNMENT
    - H1_SIDE_ALIGNMENT
    - FAVORABLE_CLOSE_LOCATION
    - EXHAUSTION_PRESSURE
    - TREND_AGREEMENT_SCORE
  no_order_book_data_available: true
  unavailable_context_behavior: EXPLICIT_NOT_PRESENT

regime:
  probabilistic_router:
    classes: [BULLISH, NEUTRAL, BEARISH]
    calibration: ONE_VS_REST_PLATT_THEN_NORMALIZE
    require_log_loss_below_training_prior: true
    require_accuracy_not_below_majority: true

late_entry_detector:
  target: LATE_OR_ADVERSE_ENTRY
  mandatory_for_selection: true
  calibration: PLATT_ON_CALIBRATION_ONLY
  no_fixed_production_threshold: true

protection_profiles:
  CURRENT_TS:
    break_even_trigger_roe: 0.08
    break_even_offset_fraction: 0.003
    trailing_activation_roe: 0.15
    trailing_callback_roe: 0.08
  LOCK_AT_5_ROE:
    break_even_trigger_roe: 0.05
    break_even_offset_fraction: 0.0016666666666666668
    trailing_activation_roe: 0.05
    trailing_callback_roe: 0.08
  LOCK_AT_10_ROE:
    break_even_trigger_roe: 0.10
    break_even_offset_fraction: 0.0033333333333333335
    trailing_activation_roe: 0.10
    trailing_callback_roe: 0.08
  LOCK_AT_20_ROE:
    break_even_trigger_roe: 0.20
    break_even_offset_fraction: 0.006666666666666667
    trailing_activation_roe: 0.20
    trailing_callback_roe: 0.08
  shared:
    leverage: 15.0
    hard_stop_roe: -0.40
    take_profit_roe: 0.50
    use_atr_trailing: true
    atr_period: 14
    atr_multiplier: 1.5
    round_trip_cost_fraction: 0.001
    intrabar_paths: [OPEN_HIGH_LOW_CLOSE, OPEN_LOW_HIGH_CLOSE]
    aggregate: WORST_INTRABAR_PATH
  profile_choice_source: CALIBRATION_ONLY_MODEL_PREDICTION
  production_effect: NONE

models:
  architecture: SIDE_AND_ARCHETYPE_SPECIALISTS
  estimator: HISTOGRAM_GRADIENT_BOOSTING
  heads:
    - CLEAN_ENTRY_PROBABILITY
    - POSITIVE_PROTECTED_NET_PROBABILITY
    - LATE_ENTRY_PROBABILITY
    - EXPECTED_PROTECTED_NET
    - MAE_Q90
    - TIME_TO_POSITIVE
    - CAPTURE_EFFICIENCY
    - PROFILE_PROTECTED_NET
  probability_calibration: PLATT_ON_CALIBRATION_ONLY
  score: JOINT_GEOMETRIC_QUALITY
  unknown_state: ABSTAIN

ablations:
  purpose: DIAGNOSTIC_ONLY
  calibration_score_quantile: 0.80
  variants: [ENTRY_ONLY, MAE_AND_SPEED, NO_LATE_PENALTY, NO_CAPTURE_WEIGHT, FULL]

validation:
  method: PURGED_EXPANDING_WALK_FORWARD
  folds: 4
  embargo_minutes: 120
  independent_rows_only_for_test: true
  score_quantiles: [0.70, 0.75, 0.80, 0.85, 0.90]
  maximum_late_probability_quantiles: [0.30, 0.40, 0.50]
  maximum_mae_quantiles: [0.40, 0.50, 0.60]
  maximum_selected_per_timestamp: 1
  minimum_calibration_selections: 40
  minimum_test_selections_per_fold: 20
  minimum_positive_folds: 3
  require_worst_fold_non_negative: true
  require_above_current_brain_control: true
  require_mae_below_current_brain_control: true
  require_capture_above_current_brain_control: true
  minimum_router_skilled_folds: 3
  leave_one_symbol_out_required: true
  minimum_symbols_without_regression: 8
  bootstrap_samples: 500
  maximum_p95_opportunity_gap_hours: 72
  prohibit_test_threshold_tuning: true
  prohibit_forced_trade_quota: true

deployment:
  model_export: PROHIBITED_UNTIL_ALL_GATES_PASS
  shadow_runtime: PROHIBITED_UNTIL_SEPARATE_AUTHORIZATION
  live_runtime: PROHIBITED
  exchange_authority: false
  exchange_calls: 0
  exchange_mutations: 0
