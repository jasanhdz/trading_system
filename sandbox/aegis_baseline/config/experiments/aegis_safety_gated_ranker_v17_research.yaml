  source_v16_validation_sha256: 22d8b9b02f53eae6c8439ca13e8085981a1cdd26fae6ee5460b99d10932f6b24
  source_v16_report: reports/governance/aegis_prospective_validation/live/economic_ranker_v16/aegis_economic_ranker_v16_research_report.md
