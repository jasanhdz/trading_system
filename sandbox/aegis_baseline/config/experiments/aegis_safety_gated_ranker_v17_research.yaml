  evidence_status: RETROSPECTIVE_AFTER_V16
  entry_rule: NEXT_BAR_OPEN

feature_contracts:
  LONG: V15_LONG_129
  SHORT: V15_SHORT_168
  add_features: NONE
  remove_features: NONE

controls:
  safety_composite:
    identity: V15_INDEPENDENT_HEAD_COMPOSITE
    policy: V15_CALIBRATION_ONLY_SCORE_QUANTILE
  direct_ranker:
    identity: V16_PAIRWISE_TRAJECTORY_RANKER
    policy: V16_CALIBRATION_ONLY_SCORE_QUANTILE

candidate:
  identity: V17_SAFETY_GATE_THEN_PAIRWISE_RANKER
  one_pipeline_per_side: true
  safety_heads:
    clean: V15_BALANCED_LOGISTIC_CLASSIFIER
    danger: V15_BALANCED_LOGISTIC_CLASSIFIER
    mae: V15_HISTOGRAM_GRADIENT_BOOSTING_Q90
  ranker: V16_STANDARDIZED_SGD_LOGISTIC_PAIRWISE
  ranking_scope: SAFETY_GATE_SURVIVORS_ONLY
  maximum_selected_per_timestamp: 1
  prohibit_test_training: true
  prohibit_test_threshold_tuning: true

calibration:
  split_method: CHRONOLOGICAL_HALF
  gate_calibration_role: FIRST_HALF
  rank_calibration_role: SECOND_HALF
  gate_grid:
    minimum_clean_probability_quantiles: [0.00, 0.25, 0.50]
    maximum_danger_probability_quantiles: [0.25, 0.50, 0.75]
    maximum_mae_q90_quantiles: [0.25, 0.50, 0.75]
  gate_choice_order:
    - LOWER_ADVERSE_FIRST_RATE
    - LOWER_MEAN_MAE
    - HIGHER_MEAN_UTILITY
    - HIGHER_SURVIVOR_RATE
  rank_score_quantiles: [0.80, 0.90, 0.95]
  rank_choice_order:
    - HIGHER_MEAN_UTILITY
    - HIGHER_CVAR
    - LOWER_MEAN_MAE
  minimum_gate_survivors: 100
  minimum_gate_survivor_rate: 0.10
  minimum_rank_selected: 20

validation:
  method: PURGED_EXPANDING_WALK_FORWARD_WITH_SPLIT_CALIBRATION
  embargo_minutes: 120
  minimum_rows_per_partition: 500
  minimum_training_pairs: 10000
  required_improvement_folds: 3
  folds:
    - {id: 1, train_end: '2025-11-26T18:55:00+00:00', calibration_end: '2026-01-02T06:55:00+00:00', test_end: '2026-02-07T18:55:00+00:00'}
    - {id: 2, train_end: '2026-01-02T06:55:00+00:00', calibration_end: '2026-02-07T18:55:00+00:00', test_end: '2026-03-16T06:55:00+00:00'}
    - {id: 3, train_end: '2026-03-16T06:55:00+00:00', calibration_end: '2026-04-21T18:55:00+00:00', test_end: '2026-05-28T06:55:00+00:00'}
    - {id: 4, train_end: '2026-07-03T18:55:00+00:00', calibration_end: '2026-07-17T18:55:00+00:00', test_end: '2026-08-09T06:55:00+00:00'}
  require_positive_mean_utility: true
  require_improvement_over_both_controls:
    - mean_utility
    - cvar
    - positive_rate
    - adverse_first_rate
    - mean_mae_fraction
    - clean_rate
  minimum_selection_count_ratio_vs_v16: 0.50
  maximum_p95_gap_ratio_vs_v16: 2.00

promotion:
  current_experiment_can_promote: false
  reason: NO_POST_V16_UNTOUCHED_HOLDOUT
  future_holdout_required: true
  shadow_authorization_required: true
  live_promotion: PROHIBITED

deployment:
  model_export: PROHIBITED
  shadow_runtime: PROHIBITED_UNTIL_SEPARATE_AUTHORIZATION
  live_runtime: PROHIBITED
  exchange_authority: false
  exchange_calls: 0
  exchange_mutations: 0
