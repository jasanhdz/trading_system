[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ideal-entry-reverse-engineering-w12"
version = "0.1.0"
description = "Causal reverse engineering of ideal historical entry zones"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyarrow>=25.0.0",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
