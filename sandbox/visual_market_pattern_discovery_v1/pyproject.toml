[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-market-pattern-discovery-v1"
version = "0.1.0"
description = "Research-only causal visual market pattern discovery"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "Pillow>=10",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.optional-dependencies]
openclip = ["open-clip-torch>=2.24"]
umap = ["umap-learn>=0.5"]
fiftyone = ["fiftyone>=0.25"]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

